<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--bg2:#fff;--bg3:#eef0f4;--border:#e2e6ed;
  --text:#18202e;--text2:#4a5568;--text3:#8a95a8;
  --red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;
  --accent:#e63329;--navy:#1e3a8a;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --r:8px;--rl:12px;--sh:0 1px 4px rgba(0,0,0,.08);--shm:0 4px 20px rgba(0,0,0,.12);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
nav{background:var(--bg2);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;padding:0 1.5rem;gap:.4rem;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.logo{font-weight:600;font-size:15px;color:var(--accent);margin-right:.3rem}.logo span{font-weight:400;font-size:12px;color:var(--text3)}
.nl{font-size:13px;color:var(--text2);text-decoration:none;padding:5px 10px;border-radius:var(--r);font-weight:500;white-space:nowrap}
.nl:hover{background:var(--bg3)}.nl.on{color:var(--accent);background:var(--bg3)}
.ml{margin-left:auto;display:flex;align-items:center;gap:8px}
.ubadge{font-size:11px;font-family:var(--mono);background:var(--bg3);padding:3px 9px;border-radius:99px;color:var(--text2)}
.lout{font-size:12px;background:none;border:1px solid var(--border);border-radius:var(--r);padding:4px 9px;cursor:pointer;color:var(--text3)}
/* undermeny */
.sub-nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px;padding:8px 1.5rem;flex-wrap:wrap;position:sticky;top:54px;z-index:40}
.sn{font-size:13px;padding:6px 11px;border-radius:var(--r);cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;font-weight:500;border-bottom:2px solid transparent}
.sn:hover{background:var(--bg3)}.sn.on{color:var(--text);border-bottom-color:var(--navy);border-radius:var(--r) var(--r) 0 0;font-weight:700}
.sn .bdg{background:var(--navy);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px;margin-left:4px}
.page{max-width:1560px;margin:0 auto;padding:1rem 1.5rem 3rem}
h1{font-size:20px;font-weight:700;margin-bottom:2px}
.lead{color:var(--text3);font-size:13px;margin-bottom:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:.9rem 1.1rem;box-shadow:var(--sh);margin-bottom:12px}
.ct{font-size:15px;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;gap:8px}
.ct .r{margin-left:auto;font-weight:400}
.lblx{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:10px 0 3px;display:block}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--bg2);color:var(--text)}
textarea{resize:vertical;min-height:52px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.b{padding:6px 11px;border:1px solid var(--border);background:var(--bg2);border-radius:var(--r);cursor:pointer;font-size:12.5px;color:var(--text2);font-family:inherit;white-space:nowrap}
.b:hover{color:var(--text);border-color:var(--text3)}
.b.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.b.dark{background:var(--text);color:var(--bg2);border-color:var(--text);font-weight:600}
.b.sm{padding:3px 8px;font-size:11.5px}.b.ghost{border-style:dashed;color:var(--text3)}
.chip{font-size:12.5px;padding:5px 12px;border:1px solid var(--border);background:var(--bg2);border-radius:99px;cursor:pointer;color:var(--text2);font-family:inherit}
.chip.on{background:var(--text);color:var(--bg2);border-color:var(--text);font-weight:600}
.chip.warn{color:var(--red);border-color:rgba(220,38,38,.4)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sub{font-size:11.5px;color:var(--text3)}
.x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:3px 4px}.x:hover{color:var(--red)}
/* kanban */
.kb{display:grid;gap:12px;align-items:start}
.kb3{grid-template-columns:repeat(3,1fr)}.kb4{grid-template-columns:repeat(4,1fr)}
.col{background:var(--bg3);border-radius:var(--rl);padding:10px;min-height:120px}
.col h3{font-size:13px;font-weight:600;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--text2)}
.kc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.kc:hover{border-color:var(--text3)}
.kc.noown{border-left:3px solid var(--amber)}.kc.over{border-color:rgba(220,38,38,.45)}
.kc .top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text3)}
.kc .nr{font-weight:700;color:var(--text)}
.kc .tt{font-size:13px;margin:4px 0 6px;line-height:1.35}
.kc .ft{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px;gap:6px}
.pri-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px}.pri-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber)}
.pri-dot.high::before{background:var(--red)}.pri-dot.low::before{background:var(--green)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--border);background:var(--bg3);color:var(--text2)}
.tag.dark{background:var(--text);color:var(--bg2);border-color:var(--text);font-weight:600}
.tag.red{background:rgba(220,38,38,.1);color:var(--red);border-color:rgba(220,38,38,.35)}
/* sak */
.case{display:grid;grid-template-columns:250px 1fr 250px;gap:14px;align-items:start}
.side{position:sticky;top:112px;display:flex;flex-direction:column;gap:10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{border:1px solid var(--border);border-left:3px solid var(--text3);border-radius:var(--r);padding:9px 10px;background:var(--bg2);min-height:110px}
.cat h4{font-size:13px;margin-bottom:2px}.cat .hint{font-size:11px;color:var(--text3);font-style:italic;line-height:1.35;margin-bottom:6px}
.cause{display:grid;grid-template-columns:1fr 24px 22px;gap:4px;align-items:center;margin-bottom:3px}
.cause input{padding:4px 7px;font-size:12.5px;border-color:transparent;background:var(--bg3)}
.flag{background:none;border:none;cursor:pointer;font-size:13px;opacity:.3;padding:2px}.flag.on{opacity:1}
.cause.ikke input{color:var(--text3);text-decoration:line-through}
.why-card{border:1px solid var(--border);border-left:3px solid var(--navy);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.why-row{display:grid;grid-template-columns:26px 1fr 22px;gap:6px;align-items:start;margin:6px 0}
.why-row .n{width:20px;height:20px;border:1px solid var(--border);border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--text3);margin-top:6px}
.klass{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.rot{border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;margin-bottom:8px}
.rot.is{border:2px solid var(--text)}
.act{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;display:grid;grid-template-columns:1fr 150px 130px 130px 22px;gap:6px;align-items:start}
.act.closed textarea{text-decoration:line-through;color:var(--text3)}
.cmt{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--border)}.cmt b{font-size:12px}
.rep{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.rep .g{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.report h3{font-size:15px;margin:14px 0 4px}.report p,.report li{font-size:13px;line-height:1.55;color:var(--text2)}.report ul{margin-left:18px}
.report table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}.report th{text-align:left;font-size:10px;font-family:var(--mono);text-transform:uppercase;color:var(--text3);padding:4px 6px;border-bottom:1px solid var(--border)}.report td{padding:5px 6px;border-bottom:1px solid var(--border)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}table.t th{font-size:10px;font-family:var(--mono);text-transform:uppercase;color:var(--text3)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--bg3);border-radius:var(--r);padding:.55rem .75rem}.kl{font-size:10px;font-family:var(--mono);text-transform:uppercase;color:var(--text3)}.kv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
.empty{color:var(--text3);font-size:12.5px;padding:.5rem 0;text-align:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
.mover.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;width:560px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shm)}
.ro .cause input,.ro textarea,.ro .act input,.ro .act select{pointer-events:none}
@media(max-width:1150px){.case{grid-template-columns:1fr}.side{position:static}.kb3,.kb4,.cats,.g3{grid-template-columns:1fr}.act{grid-template-columns:1fr}}
@media print{nav,.sub-nav,.noprint,.side,.x,.b,.flag{display:none!important}.case{display:block}.page{padding:0}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>

<nav>
  <div class="logo">Diplom-is<span> / Produksjon</span></div>
  <a href="index.html" class="nl">Dashboard</a>
  <div class="ml">
    <div class="ubadge" id="ubadge">—</div>

</nav>
<div class="sub-nav" id="subnav" style="display:none"></div>
<main class="page" id="app" style="display:none"><div id="main"></div></main>

<script>
const LINES=['Løp 1','Løp 2','Løp 3','Rollo','Koba','Glacier','Krokan'];
const FB={apiKey:"AIzaSyCL4x1KNwgeDxqTFeP32BndJgH4B5MworQ",authDomain:"messystem-f14dd.firebaseapp.com",databaseURL:"https://messystem-f14dd-default-rtdb.firebaseio.com",projectId:"messystem-f14dd",storageBucket:"messystem-f14dd.firebasestorage.app",messagingSenderId:"1001051250309",appId:"1:1001051250309:web:0b2d82db50e8fd24ce93ec"};
if(!firebase.apps.length)firebase.initializeApp(FB);
localStorage.setItem('firebaseConfig',JSON.stringify(FB));
const db=firebase.database(),auth=firebase.auth();

/* ═══════════════════════════════════════════════════════════════════════════
   SAKER OG ROTÅRSAK — hendelsesrapport → rapportmottak → sak → rotårsak → tiltak → arkiv
   Arbeidsflyten følger verktøyet fabrikken bruker fra før (OlavaTech), bygget inn i
   MES-et så stoppene fra linjene kan mates rett inn og effekt måles på hendelsene.

   rca/reports/{id}   {text, line, where, when, done, createdAt, createdBy, createdByName,
                       caseId|null, archived, mesEventId?}          ← alle innloggede kan opprette
   rca/cases/{id}     {nr, title, priority:low|medium|high, stage:opprettet|undersoker|bekreftet,
                       status:open|archived, owner, ownerName, participants{uid:navn},
                       line, where, machine, cause, problem, facts{}, comments{}, followers{uid:true},
                       causes{id:{cat,text,flag:mulig|ikke|'',klass:rot|medv|symptom|ikke,whys{id:{text,at}}}},
                       rcaDone{by,at}, actions{id:{type:korr|foreb,text,owner,ownerName,due,
                       pdca:ikke|plan|do|check|act|lukket|na,effect,createdAt,closedAt,closedBy}},
                       meetings{}, std, conclusion, recurringId, log{}, archiveComment, archivedAt, archivedBy}
   rca/recurring/{id} {name, description, createdAt, createdBy}
   rca/counter        løpenummer for saker (transaksjon)
   ═══════════════════════════════════════════════════════════════════════════ */
let USER=null, UID='', REPORTS={}, CASES={}, RECUR={}, USERS=[], EVENTS=[], SETTINGS={};
let VIEW='hjem', CASE=null, FILT='alle', AFILT='alle', Q='', OPEN_REP={};
const CATS=[
 ['folk','Folk (ansatte og ledelse)','Manglende opplæring, feilkommunikasjon, lite erfaring, feil bemanning, uklare beslutninger'],
 ['metode','Arbeidsmåte (prosesser og metoder)','Manglende prosedyrer, feil rekkefølge i arbeidssteg, avvik fra standard, uklare instrukser'],
 ['kontroll','Kontroll og data','Feil på måleinstrumenter, manglende kalibrering, feilregistreringer, manglende prøver eller rapporter'],
 ['miljo','Omgivelser (miljø og forhold rundt)','Feil temperatur eller fuktighet, dårlig lys, mye støy, dårlig renhold, for lite plass'],
 ['ravare','Råvarer og emballasje','Dårlig råvarekvalitet, feil i leveransen, feil lagring, skadet emballasje, blanding av batcher'],
 ['maskin','Maskiner og utstyr','Maskinstopp, feil innstillinger, manglende vedlikehold, slitte deler, feil på verktøy eller hjelpemidler']];
const CATN={folk:'Folk',metode:'Arbeidsmåte',kontroll:'Kontroll og data',miljo:'Omgivelser',ravare:'Råvarer og emballasje',maskin:'Maskiner'};
const STAGES=[['opprettet','Opprettet sak'],['undersoker','Undersøker rotårsak'],['bekreftet','Rotårsak bekreftet']];
const PRI={low:'Lav',medium:'Middels',high:'Høy'};
const KLASS=[['rot','Rotårsak'],['medv','Medvirkende faktor'],['symptom','Symptom'],['ikke','Ikke relevant']];
const PDCA=[['ikke','Ikke påbegynt'],['plan','Plan'],['do','Do'],['check','Check'],['act','Act'],['lukket','Lukket'],['na','Ikke aktuelt']];
const PDCA_COL={ikke:'#94a3b8',plan:'#4f46e5',do:'#2563eb',check:'#0d9488',act:'#d97706',lukket:'#16a34a',na:'#cbd5e1'};
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function fmtD(m){m=Math.round(m||0);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return r?h+' t '+r+' min':h+' t';}
function fmtT(ts){if(!ts)return '—';const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDay(ts){if(!ts)return '—';const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}
function arr(o){return Object.keys(o||{}).map(k=>Object.assign({id:k},o[k])).filter(x=>x&&typeof x==='object');}
function canEdit(){return !!(USER&&(USER.role==='master'||USER.role==='leder'||USER.boardAccess===true));}
function me(){return (USER&&USER.name)||'';}
function isPlanned(c){return (SETTINGS.plannedStops||[]).includes(c)||/omstilling/i.test(c||'');}
function fail(){alert('Kunne ikke lagre. Sjekk at reglene for «rca» er publisert i Firebase, og at du har tilgang (master, leder eller Tavle-tilgang).');}

/* ── AUTH + DATA ── */
auth.onAuthStateChanged(async user=>{
  if(!user){location.href='login.html';return;}
  UID=user.uid;
  const s=await db.ref('users/'+user.uid).once('value');USER=s.val();
  if(!USER){auth.signOut();location.href='login.html';return;}
  document.getElementById('ubadge').textContent=USER.name+' · '+(USER.role==='master'?'Master':USER.role==='leder'?'Leder':'Operatør');
  document.getElementById('app').style.display='block';document.getElementById('subnav').style.display='flex';
  readHash();start();
});
let started=false;
function start(){
  if(started)return;started=true;
  db.ref('users').on('value',s=>{USERS=arr(s.val()).filter(u=>u.name&&u.role!=='bridge').map(u=>({uid:u.id,name:u.name})).sort((a,b)=>a.name.localeCompare(b.name,'no'));sched();});
  db.ref('settings').on('value',s=>{SETTINGS=s.val()||{};sched();});
  db.ref('events').on('value',s=>{const a=[];if(s.exists())s.forEach(c=>{const v=c.val();if(v&&v.ts&&v.line)a.push(Object.assign({id:c.key},v));});EVENTS=a.sort((x,y)=>y.ts-x.ts);sched();fromEvent();});
  db.ref('rca/reports').on('value',s=>{REPORTS=s.val()||{};sched();});
  db.ref('rca/cases').on('value',s=>{CASES=s.val()||{};sched();});
  db.ref('rca/recurring').on('value',s=>{RECUR=s.val()||{};sched();});
}
let _t=null,_dirty=false;
function typing(){const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&document.getElementById('main').contains(a));}
function sched(){if(_t)return;_t=setTimeout(()=>{_t=null;if(typing()){_dirty=true;return;}render();},150);}
document.addEventListener('focusout',()=>{if(_dirty)setTimeout(()=>{if(!typing()){_dirty=false;render();}},120);});

/* ── Navigasjon ── */
function go(v,id){VIEW=v;CASE=id||null;location.hash=v==='sak'?'sak='+id:v;window.scrollTo(0,0);render();}
function readHash(){const h=(location.hash||'').slice(1);if(h.indexOf('sak=')===0){VIEW='sak';CASE=h.slice(4);}else if(h)VIEW=h;}
window.addEventListener('hashchange',()=>{readHash();render();});

/* ── Hjelpere på data ── */
function cases(){return arr(CASES).sort((a,b)=>(b.nr||0)-(a.nr||0));}
function openCases(){return cases().filter(c=>c.status!=='archived');}
function reports(){return arr(REPORTS).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));}
function inbox(){return reports().filter(r=>!r.caseId&&!r.archived);}
function allActions(){const out=[];cases().forEach(c=>arr(c.actions).forEach(a=>out.push(Object.assign({caseId:c.id,caseNr:c.nr,caseTitle:c.title,caseArch:c.status==='archived'},a))));return out;}
function actOpen(a){return a.pdca!=='lukket'&&a.pdca!=='na';}
function overdue(a){return actOpen(a)&&a.due&&new Date(a.due).getTime()<Date.now()-86400000;}
function logCase(id,text){db.ref('rca/cases/'+id+'/log').push({at:Date.now(),by:me(),text});}
function upd(path,val){return db.ref(path).set(val===''||val==null?null:val).catch(fail);}
/* MES: stopp som hører til saken (samme linje, og maskin/årsak når de er satt) */
function mesFor(c,since,until){if(!c.line||!LINES.includes(c.line))return [];return EVENTS.filter(e=>e.line===c.line&&(!c.machine||e.machine===c.machine)&&(!c.cause||e.cause===c.cause)&&(!since||e.ts>=since)&&(!until||e.ts<until));}

/* ═════════ RENDER ═════════ */
function render(){
  if(!USER)return;
  const nb=inbox().length;
  const tabs=[['hjem','Mine oppgaver'],['folger','Følger'],['mottak','Rapportmottak'],['saker','Saker'],['tiltak','Tiltak'],['gjentagende','Gjentagende'],['arkiv','Arkivert']];
  document.getElementById('subnav').innerHTML='<button class="b pri" data-act="nyhendelse">+ Ny hendelse</button>'
    +tabs.map(t=>'<button class="sn'+((VIEW===t[0]||(VIEW==='sak'&&t[0]==='saker'))?' on':'')+'" data-go="'+t[0]+'">'+t[1]+(t[0]==='mottak'&&nb?'<span class="bdg">'+nb+'</span>':'')+'</button>').join('');
  const m=document.getElementById('main');
  m.innerHTML=({hjem:vHjem,folger:vFolger,mottak:vMottak,saker:vSaker,tiltak:vTiltak,gjentagende:vGjent,arkiv:vArkiv,sak:vSak}[VIEW]||vHjem)();
}
function caseCard(c){
  const nrep=reports().filter(r=>r.caseId===c.id).length;

function vMottak(){
  const inb=inbox();
  // Forslag fra MES: reelle stopp som gjentar seg siste 30 dager, uten åpen sak på samme linje/maskin/årsak
  const since=Date.now()-30*86400000, agg={};
  EVENTS.filter(e=>e.ts>=since&&!isPlanned(e.cause)&&!e.unhandled&&e.cause&&!/automatisk/i.test(e.cause)).forEach(e=>{const k=e.line+'|'+(e.machine||'')+'|'+e.cause;const a=agg[k]=agg[k]||{line:e.line,machine:e.machine||'',cause:e.cause,n:0,min:0,last:e};a.n++;a.min+=e.duration||0;});
  const oc=openCases();
  const sg=Object.values(agg).filter(a=>(a.n>=2||a.min>=60)&&!oc.some(c=>c.line===a.line&&(c.machine||'')===a.machine&&(c.cause||'')===a.cause)).sort((a,b)=>b.min-a.min).slice(0,6);

    +(sg.length?'<h1 style="font-size:15px;margin-top:20px">⚙ Forslag fra MES</h1><div class="lead">Stopp som har gjentatt seg de siste 30 dagene og ikke har en åpen sak.</div>'+sg.map(a=>'<div class="rep"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>'+esc(a.cause)+'</b><div class="sub">'+esc(a.line)+(a.machine?' · '+esc(a.machine):'')+' · <b class="bad">'+a.n+' ganger · '+fmtD(a.min)+'</b></div></div>'+(canEdit()?'<button class="b dark sm" data-act="mesrap" data-line="'+esc(a.line)+'" data-machine="'+esc(a.machine)+'" data-cause="'+esc(a.cause)+'" data-n="'+a.n+'" data-min="'+a.min+'">Opprett sak</button>':'')+'</div></div>').join(''):'')+'</div>';

    +'<foreignObject x="872" y="'+(mid-36)+'" width="122" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;font-weight:600;text-align:center;border:1px solid var(--border);border-radius:6px;padding:6px;background:var(--bg3);height:72px;display:flex;align-items:center;justify-content:center;overflow:hidden">'+esc((c.title||'').slice(0,60))+'</div></foreignObject>';

function donut(as){

  const segs=PDCA.map(p=>{const n=as.filter(a=>(a.pdca||'ikke')===p[0]).length;if(!n)return '';const len=n/tot*C;const el='<circle r="'+R+'" cx="45" cy="45" fill="none" stroke="'+PDCA_COL[p[0]]+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 45 45)"/>';acc+=len;return el;}).join('');
  return '<div style="display:flex;gap:14px;align-items:center;margin-bottom:10px"><svg width="90" height="90" viewBox="0 0 90 90">'+(as.length?segs:'<circle r="'+R+'" cx="45" cy="45" fill="none" stroke="var(--bg3)" stroke-width="16"/>')+'</svg><div class="sub" style="line-height:1.8">'+PDCA.map(p=>{const n=as.filter(a=>(a.pdca||'ikke')===p[0]).length;return n?'<span style="color:'+PDCA_COL[p[0]]+'">●</span> '+p[1]+' · '+n+' ('+Math.round(n/tot*100)+' %)<br>':'';}).join('')+'</div></div>';
}

  const follows=(c.followers||{})[UID];

function removeDemo(){
  if(!confirm('Fjerne alle demo-saker, demo-rapporter og demo-problemer? Ekte saker røres ikke.'))return;
  const upd={};
  cases().filter(c=>c.demo).forEach(c=>upd['cases/'+c.id]=null);
  reports().filter(r=>r.demo).forEach(r=>upd['reports/'+r.id]=null);
  arr(RECUR).filter(r=>r.demo).forEach(r=>upd['recurring/'+r.id]=null);
  db.ref('rca').update(upd).then(()=>render()).catch(fail);
}

/* ═════════ HANDLINGER ═════════ */
function modal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function openNyHendelse(pre){
  pre=pre||{};const n=new Date(pre.when||Date.now());
  modal('<div class="ct">+ Ny hendelse</div><div class="sub" style="margin-bottom:6px">Rapporten havner i Rapportmottak'+(pre.caseId?' og kobles til saken':'')+'.</div>'
    +'<span class="lblx">Beskriv hendelsen *</span><textarea id="nh-text" rows="4" placeholder="Hva skjedde? Hva ser du?">'+esc(pre.text||'')+'</textarea>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><span class="lblx">Hvor? — linje</span><select id="nh-line"><option value="">— annet —</option>'+LINES.map(l=>'<option'+(l===pre.line?' selected':'')+'>'+l+'</option>').join('')+'</select></div><div><span class="lblx">Sted / maskin</span><input id="nh-where" value="'+esc(pre.where||'')+'" placeholder="f.eks. pakkemaskin"></div></div>'
    +'<span class="lblx">Når?</span><input type="datetime-local" id="nh-when" value="'+n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+'T'+pad(n.getHours())+':'+pad(n.getMinutes())+'">'
    +'<span class="lblx">Er noe gjort for å løse det?</span><textarea id="nh-done" rows="2" placeholder="Nei / Ja — hva?">'+esc(pre.done||'')+'</textarea>'
    +'<div style="display:flex;gap:8px;margin-top:12px"><button class="b pri" id="nh-save" style="flex:1">Send inn</button><button class="b" id="nh-cancel" style="flex:1">Avbryt</button></div>');
  document.getElementById('nh-cancel').onclick=closeModal;
  document.getElementById('nh-save').onclick=()=>{
    const text=document.getElementById('nh-text').value.trim();if(text.length<5){alert('Beskriv hendelsen.');return;}
    const wv=document.getElementById('nh-when').value;const when=wv?new Date(wv).getTime():Date.now();
    const rep={text,line:document.getElementById('nh-line').value,where:document.getElementById('nh-where').value.trim(),when:isNaN(when)?Date.now():when,done:document.getElementById('nh-done').value.trim(),createdAt:Date.now(),createdBy:UID,createdByName:me()};
    if(pre.caseId)rep.caseId=pre.caseId;if(pre.mesEventId)rep.mesEventId=pre.mesEventId;if(pre.machine)rep.machine=pre.machine;if(pre.cause)rep.cause=pre.cause;
    db.ref('rca/reports').push(rep).then(()=>{closeModal();if(pre.caseId)logCase(pre.caseId,'la til ny rapport');else go('mottak');}).catch(fail);
  };
}
/* rotarsak.html?event=<id> fra 🔍 i dashbordet → skjemaet forhåndsutfylt fra MES-stoppen */
let _evDone=false;
function fromEvent(){
  if(_evDone)return;const id=new URLSearchParams(location.search).get('event');if(!id){_evDone=true;return;}
  const e=EVENTS.find(x=>x.id===id);if(!e)return;_evDone=true;
  const ex=reports().find(r=>r.mesEventId===id);
  if(ex){if(ex.caseId)go('sak',ex.caseId);else go('mottak');return;}
  openNyHendelse({text:(e.cause||'Stopp')+(e.comment?' — '+e.comment:'')+' (varighet '+fmtD(e.duration)+')',line:e.line,where:e.machine||'',when:e.ts,mesEventId:id,machine:e.machine||'',cause:e.cause||''});
}
async function createCase(rep,extra){
  const tr=await db.ref('rca/counter').transaction(n=>(n||0)+1).catch(()=>null);
  if(!tr||!tr.committed){fail();return null;}
  const nr=tr.snapshot.val(), ref=db.ref('rca/cases').push(), now=Date.now();
  const c=Object.assign({nr,title:(rep.text||'Ny sak').slice(0,90),priority:'medium',stage:'opprettet',status:'open',line:rep.line||'',where:[rep.line,rep.where].filter(Boolean).join(' ')||'',machine:rep.machine||'',cause:rep.cause||'',createdAt:now,createdBy:rep.createdBy||UID,createdByName:rep.createdByName||me()},extra||{});
  await ref.set(c).catch(fail);
  if(rep.id)await db.ref('rca/reports/'+rep.id+'/caseId').set(ref.key);
  logCase(ref.key,'opprettet saken'+(rep.id?' fra rapport':''));
  return ref.key;
}
function pick(title,opts,cb){
  modal('<div class="ct">'+title+'</div><select id="pk" size="10" style="height:260px">'+opts.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('')+'</select><div style="display:flex;gap:8px;margin-top:10px"><button class="b pri" id="pk-ok" style="flex:1">Velg</button><button class="b" id="pk-no" style="flex:1">Avbryt</button></div>');
  document.getElementById('pk-no').onclick=closeModal;
  document.getElementById('pk-ok').onclick=()=>{const v=document.getElementById('pk').value;if(!v)return;closeModal();cb(v);};
}

/* Delegerte lyttere — tåler at innholdet tegnes på nytt */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest&&ev.target.closest('[data-go],[data-act],[data-add],[data-del]');if(!t)return;
  if(ev.target.closest('button')&&ev.target.closest('button')!==t&&t.dataset.go)return;       // knapp inne i et klikkbart kort
  const P=CASE?'rca/cases/'+CASE+'/':'', d=t.dataset;
  if(d.act){
    const a=d.act;
    if(a==='nyhendelse'){openNyHendelse(d.case?{caseId:d.case,line:(CASES[d.case]||{}).line}:{});return;}
    if(a==='toggrep'){OPEN_REP[d.id]=!OPEN_REP[d.id];render();return;}
    if(a==='filt'){FILT=d.v;render();return;}
    if(a==='afilt'){AFILT=d.v;render();return;}
    if(a==='folg'){upd(P+'followers/'+UID,(CASES[CASE].followers||{})[UID]?null:true);return;}
    if(!canEdit()){alert('Du har ikke tilgang til å behandle saker. Master gir «Tavle-tilgang» under Brukere.');return;}
    if(a==='nysak'){const r=Object.assign({id:d.id},REPORTS[d.id]);const id=await createCase(r);if(id)go('sak',id);return;}
    if(a==='koble'){pick('Koble rapporten til en sak',openCases().map(c=>[c.id,'#'+c.nr+' '+(c.title||'')]),id=>{db.ref('rca/reports/'+d.id+'/caseId').set(id).catch(fail);logCase(id,'koblet til en ny rapport');});return;}
    if(a==='arkrep'){upd('rca/reports/'+d.id+'/archived',true);return;}
    if(a==='gjenrep'){upd('rca/reports/'+d.id+'/archived',null);return;}
    if(a==='demoinn'){loadDemo();return;}
    if(a==='demout'){removeDemo();return;}
    if(a==='mesrap'){const id=await createCase({text:d.cause+' — '+(d.machine||d.line)+' ('+d.n+' ganger, '+fmtD(+d.min)+' siste 30 dager)',line:d.line,where:d.machine,machine:d.machine,cause:d.cause},{problem:'Stoppen «'+d.cause+'» på '+d.line+(d.machine?' / '+d.machine:'')+' har gjentatt seg '+d.n+' ganger de siste 30 dagene, til sammen '+fmtD(+d.min)+' nedetid.'});if(id)go('sak',id);return;}
    if(a==='flag'){const c=(CASES[CASE].causes||{})[d.id]||{};upd(P+'causes/'+d.id+'/flag',!c.flag?'mulig':c.flag==='mulig'?'ikke':null);return;}
    if(a==='klass'){const c=(CASES[CASE].causes||{})[d.id]||{};upd(P+'causes/'+d.id+'/klass',c.klass===d.v?null:d.v);if(d.v==='rot'&&c.klass!=='rot')logCase(CASE,'klassifiserte «'+(c.text||'')+'» som rotårsak');return;}
    if(a==='rcadone'){const c=CASES[CASE];if(c.rcaDone){db.ref(P+'rcaDone').remove();logCase(CASE,'angret «RCA utført»');}else{db.ref(P.slice(0,-1)).update({rcaDone:{by:me(),at:Date.now()},stage:'bekreftet'}).catch(fail);logCase(CASE,'markerte RCA som utført');}return;}
    if(a==='cmt'){const el=document.getElementById('cmt');const v=el.value.trim();if(!v)return;el.value='';db.ref(P+'comments').push({text:v,by:UID,byName:me(),at:Date.now()}).catch(fail);return;}
    if(a==='mote'){modal('<div class="ct">+ Møte</div><span class="lblx">Når</span><input type="datetime-local" id="mt-when"><span class="lblx">Hva</span><input id="mt-text" placeholder="f.eks. gjennomgang av tiltak"><div style="display:flex;gap:8px;margin-top:10px"><button class="b pri" id="mt-ok" style="flex:1">Lagre</button><button class="b" id="mt-no" style="flex:1">Avbryt</button></div>');
      document.getElementById('mt-no').onclick=closeModal;document.getElementById('mt-ok').onclick=()=>{const w=new Date(document.getElementById('mt-when').value).getTime();if(isNaN(w)){alert('Velg tidspunkt');return;}db.ref(P+'meetings').push({when:w,text:document.getElementById('mt-text').value.trim()}).catch(fail);logCase(CASE,'la til møte '+fmtT(w));closeModal();};return;}
    if(a==='ferdig'){const com=document.getElementById('arkcom').value.trim();if(com.length<5){alert('Skriv en arkiveringskommentar først.');return;}db.ref(P.slice(0,-1)).update({status:'archived',archiveComment:com,archivedAt:Date.now(),archivedBy:me()}).catch(fail);logCase(CASE,'arkiverte saken: '+com);go('arkiv');return;}
    if(a==='gjenapne'){db.ref(P.slice(0,-1)).update({status:'open',archivedAt:null,archivedBy:null}).catch(fail);logCase(CASE,'gjenåpnet saken');return;}
    if(a==='nygjent'||a==='redgjent'){const cur=a==='redgjent'?RECUR[d.id]:{};const name=prompt('Navn på det gjentagende problemet:',cur.name||'');if(!name)return;const desc=prompt('Beskrivelse (valgfritt):',cur.description||'');
      if(a==='nygjent')db.ref('rca/recurring').push({name,description:desc||'',createdAt:Date.now(),createdBy:me()}).catch(fail);else db.ref('rca/recurring/'+d.id).update({name,description:desc||''}).catch(fail);return;}
    if(a==='slettgjent'){if(!confirm('Slette det gjentagende problemet? Sakene beholdes.'))return;cases().filter(c=>c.recurringId===d.id).forEach(c=>db.ref('rca/cases/'+c.id+'/recurringId').remove());db.ref('rca/recurring/'+d.id).remove();return;}
    if(a==='koblegjent'){pick('Koble sak til «'+RECUR[d.id].name+'»',cases().filter(c=>c.recurringId!==d.id).map(c=>[c.id,'#'+c.nr+' '+(c.title||'')+(c.status==='archived'?' (arkivert)':'')]),id=>{upd('rca/cases/'+id+'/recurringId',d.id);logCase(id,'koblet til gjentagende problem «'+RECUR[d.id].name+'»');});return;}
    return;
  }
  if(d.add){
    if(!canEdit())return;let path,obj;
    if(d.add==='facts'){path=P+'facts';obj={text:'',by:me(),at:Date.now()};}
    if(d.add==='causes'){path=P+'causes';obj={cat:d.cat,text:'',at:Date.now()};}
    if(d.add==='whys'){path=P+'causes/'+d.id+'/whys';obj={text:'',at:Date.now()};}
    if(d.add==='actions'){path=P+'actions';obj={type:d.type,text:'',pdca:'plan',createdAt:Date.now()};}
    const ref=db.ref(path).push();ref.set(obj).then(()=>setTimeout(()=>{const el=document.querySelector('[data-save="'+path+'/'+ref.key+'/text"]');if(el){el.scrollIntoView({block:'center'});el.focus();}},350)).catch(fail);return;
  }
  if(d.del){if(!canEdit())return;if(/actions\/|causes\/[^/]+$/.test(d.del)&&!confirm('Slette?'))return;db.ref(d.del).remove().catch(fail);return;}
  if(d.go){go(d.go,d.id);return;}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='addpart'&&el.value){const u=USERS.find(x=>x.uid===el.value);if(u){upd('rca/cases/'+CASE+'/participants/'+u.uid,u.name);logCase(CASE,'la til deltaker '+u.name);}return;}
  const p=el.dataset&&el.dataset.save;if(!p)return;
  if(!canEdit()){alert('Du har ikke tilgang til å endre saker.');render();return;}
  const v=el.value.trim();
  if(el.dataset.user){const u=USERS.find(x=>x.uid===v);const base=p.replace(/\/owner$/,'');db.ref(base).update({owner:v||null,ownerName:u?u.name:null}).catch(fail);if(CASE)logCase(CASE,(/actions\//.test(p)?'satte ansvarlig for tiltak til ':'satte analyseansvarlig til ')+(u?u.name:'ingen'));return;}
  if(el.dataset.pdca){const base=p.replace(/\/pdca$/,'');const closed=v==='lukket'||v==='na';db.ref(base).update({pdca:v,closedAt:closed?Date.now():null,closedBy:closed?me():null}).catch(fail);logCase(CASE,'endret tiltak til «'+(PDCA.find(x=>x[0]===v)||['',v])[1]+'»');return;}
  upd(p,v);
  if(/\/(stage|priority)$/.test(p)&&CASE)logCase(CASE,'endret '+(/stage$/.test(p)?'status til «'+(STAGES.find(s=>s[0]===v)||['',v])[1]+'»':'prioritet til '+PRI[v]));
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){Q=ev.target.value;const pos=ev.target.selectionStart;render();const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
