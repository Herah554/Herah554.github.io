<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Logg inn — Diplom-is</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#e63329;--accent2:#ff5c52;--bg:#f4f6f9;--bg2:#fff;--bg3:#eef0f4;--border:#e2e6ed;--text:#18202e;--text2:#4a5568;--text3:#8a95a8;--green:#16a34a;--red:#dc2626;--font:'IBM Plex Sans',sans-serif;--r:8px;--rl:14px;--sh:0 4px 24px rgba(0,0,0,.10)}
body{font-family:var(--font);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:2rem 2.25rem;width:100%;max-width:380px;box-shadow:var(--sh)}
.logo{text-align:center;margin-bottom:1.75rem}
.logo-name{font-size:24px;font-weight:600;color:var(--accent);letter-spacing:-.02em}
.logo-sub{font-size:12px;color:var(--text3);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.fr{margin-bottom:1rem}
label{display:block;font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:11px 12px;font-family:var(--font);font-size:14px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,51,41,.08)}
.btn{width:100%;background:var(--accent);border:none;border-radius:var(--r);color:#fff;font-size:14px;font-weight:600;padding:12px;cursor:pointer;transition:background .15s,transform .1s;margin-top:.25rem}
.btn:hover{background:var(--accent2)}.btn:active{transform:scale(.98)}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r);padding:9px 12px;font-size:13px;color:var(--red);margin-bottom:.85rem;display:none}
.loading{color:var(--text3);font-size:13px;text-align:center;padding:1rem}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-name">Diplom-is</div>
    <div class="logo-sub">Produksjonssystem</div>
  </div>
  <div class="err" id="err"></div>
  <div class="fr">
    <label>E-post</label>
    <input type="email" id="email" placeholder="din@epost.no" onkeydown="if(event.key==='Enter')document.getElementById('pass').focus()"/>
  </div>
  <div class="fr">
    <label>Passord</label>
    <input type="password" id="pass" placeholder="Passord" onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <button class="btn" onclick="login()" id="login-btn">Logg inn</button>
</div>

<script>
// ── LIM INN DIN FIREBASE-KONFIG HER ──
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCL4x1KNwgeDxqTFeP32BndJgH4B5MworQ",
  authDomain: "messystem-f14dd.firebaseapp.com",
  databaseURL: "https://messystem-f14dd-default-rtdb.firebaseio.com",
  projectId: "messystem-f14dd",
  storageBucket: "messystem-f14dd.firebasestorage.app",
  messagingSenderId: "1001051250309",
  appId: "1:1001051250309:web:0b2d82db50e8fd24ce93ec",
  measurementId: "G-EEXS68MG05"
};
// ─────────────────────────────────────

if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
localStorage.setItem('firebaseConfig', JSON.stringify(FIREBASE_CONFIG));

firebase.auth().onAuthStateChanged(async user => {
  if(user){
    const snap = await firebase.database().ref('users/'+user.uid).once('value');
    if(snap.exists()) { window.location.href='index.html'; return; }
    await firebase.auth().signOut();
  }
});

async function login(){
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const err   = document.getElementById('err');
  const btn   = document.getElementById('login-btn');
  err.style.display='none';
  if(!email||!pass){ err.textContent='Fyll inn e-post og passord.'; err.style.display='block'; return; }
  btn.textContent='Logger inn...'; btn.disabled=true;
  try{
    const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    const snap = await firebase.database().ref('users/'+cred.user.uid).once('value');
    if(!snap.exists()){
      await firebase.auth().signOut();
      err.textContent='Brukerprofil ikke funnet. Kontakt administrator.';
      err.style.display='block';
      btn.textContent='Logg inn'; btn.disabled=false;
      return;
    }
    window.location.href='index.html';
  }catch(e){
    const msgs={
      'auth/user-not-found':'Ingen bruker med denne e-posten.',
      'auth/wrong-password':'Feil passord.',
      'auth/invalid-credential':'Feil e-post eller passord.',
      'auth/invalid-email':'Ugyldig e-postadresse.',
      'auth/too-many-requests':'For mange forsøk. Vent litt og prøv igjen.'
    };
    err.textContent = msgs[e.code]||'Innlogging feilet: '+e.message;
    err.style.display='block';
    btn.textContent='Logg inn'; btn.disabled=false;
  }
}
</script>
</body>
</html>
